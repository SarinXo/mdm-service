name: "mdm-service"

x-deploy-default-settings: &deploy-default-settings
  deploy:
    resources:
      limits:
        memory: 1g
        cpus: "0.5"
  restart: on-failure:5

x-kafka-common: &kafka-common
  image: apache/kafka:3.9.1
  healthcheck:
    test: [ "CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092" ]
    interval: 15s
    timeout: 10s
    retries: 5
  <<: *deploy-default-settings

x-kafka-environment: &Kafka-environment
  KAFKA_KRAFT_MODE: "true"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  CLUSTER_ID: "kraft-cluster-id"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2

services:

  kafka1:
    <<: *kafka-common
    container_name: kafka1
    hostname: kafka1
    ports:
      - "9191:9092"
      - "9291:9093"
      - "9391:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:9391,CONTROLLER://kafka1:9093
      <<: *Kafka-environment
    volumes:
      - ./appdata/kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-common
    container_name: kafka2
    hostname: kafka2
    ports:
      - "9192:9092"
      - "9292:9093"
      - "9392:9094"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:9392,CONTROLLER://kafka2:9093
      <<: *Kafka-environment
    volumes:
      - ./appdata/kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-common
    container_name: kafka3
    hostname: kafka3
    ports:
      - "9193:9092"
      - "9293:9093"
      - "9393:9094"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:9393,CONTROLLER://kafka3:9093
      KAFKA_NODE_ID: 3
      <<: *Kafka-environment
    volumes:
      - ./appdata/kafka3-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cluster-kafka-ui
    ports:
      - "9080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    <<: *deploy-default-settings

  otp-service-postgresql:
    image: postgres:17-alpine3.21
    container_name: otp-service-postgresql
    ports:
      - "${POSTGRES_PORT:-5454}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-test}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-pswd}"
      POSTGRES_DB: "${POSTGRES_DB:-mdm-service}"
    volumes:
      - ./appdata/mdm_service_postgresql:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres_user -d postgres_db" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: on-failure

volumes:
  postgres_data:
    driver: local
