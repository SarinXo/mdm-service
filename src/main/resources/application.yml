spring:
  application:
    name: mdm-service
  datasource:
    url: ${mdm-service.datasource.url}
    username: ${mdm-service.datasource.username}
    password: ${mdm-service.datasource.password}
    hikari:
      schema: ${mdm-service.datasource.schema}
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS ${spring.datasource.hikari.schema};

  jpa:
    hibernate:
      ddl-auto: validate