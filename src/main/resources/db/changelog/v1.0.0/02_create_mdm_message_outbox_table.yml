databaseChangeLog:
  - changeSet:
      id: "02_create_mdm_message_outbox_table.yml"
      author: SarinXo
      changes:
        - createTable:
            tableName: mdm_message_outbox
            remarks: "Статус отправки MDM события во внешний сервис"
            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true

              - column:
                  name: mdm_message_id
                  type: UUID
                  remarks: "Уникальный идентификатор события из таблицы mdmMessage"

              - column:
                  name: status
                  type: VARCHAR
                  remarks: "Статус доставки сообщения"

              - column:
                  name: target
                  type: VARCHAR
                  remarks: "Направление, куда должно быть доставлено сообщение"

              - column:
                  name: response_data
                  type: JSONB
                  remarks: "Ответ внешнего сервиса"

              # аудируемые поля
              - column:
                  name: create_time
                  type: TIMESTAMP
                  remarks: "Дата создания объекта"

              - column:
                  name: last_update_time
                  type: TIMESTAMP
                  remarks: "Время последнего изменения"

              - column:
                  name: create_user
                  type: varchar
                  remarks: "Пользователь/сервис, который создал запись"

              - column:
                  name: last_update_user
                  type: varchar
                  remarks: "Пользователь/сервис, который обновил последним запись"