databaseChangeLog:
  - changeSet:
      id: "01_create_mdm_message_table.yml"
      author: SarinXo
      changes:
        - createTable:
            tableName: mdm_message
            remarks: "Событие из MDM системы"
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true

              - column:
                  name: external_id
                  type: UUID
                  remarks: "Уникальный идентификатор сообщения из внешней системы"

              - column:
                  name: guid
                  type: VARCHAR
                  remarks: "Уникальный идентификатор клиента"

              - column:
                  name: type
                  type: VARCHAR
                  remarks: "Тип события"

              - column:
                  name: payload
                  type: JSONB
                  remarks: "Содержимое сообщения"

              - column:
                  name: description
                  type: VARCHAR
                  remarks: "Описание для короткой ссылки"

              # аудируемые поля
              - column:
                  name: create_time
                  type: TIMESTAMP
                  remarks: "Дата создания объекта"

              - column:
                  name: last_update_time
                  type: TIMESTAMP
                  remarks: "Время последнего изменения"
                  
              - column:
                  name: create_user
                  type: varchar
                  remarks: "Пользователь/сервис, который создал запись"
              - column:
                  name: last_update_user
                  type: varchar
                  remarks: "Пользователь/сервис, который обновил последним запись"
